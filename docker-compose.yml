services:
  mongo:
    image: mongo:${MONGO_VERSION:-8}
    container_name: ${MONGO_CONTAINER_NAME:-eggseller-mongo}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - appnet
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26}
    container_name: ${NEO4J_CONTAINER_NAME:-eggseller-neo4j}
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: ${WEB_IMAGE:-eggseller-web:latest}
    container_name: ${WEB_CONTAINER_NAME:-eggseller-web}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEO4J_URI=${NEO4J_URI_INTERNAL:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - MONGODB_URI=${MONGODB_URI_INTERNAL:-mongodb://mongo:27017/eggseller}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-12h}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode/big-pickle}
      # URL interna: el MCP embebido se alcanza dentro del propio contenedor
      - APP_URL=http://127.0.0.1:3000
      # El standalone debe escuchar en todas las interfaces (si no, solo en
      # el hostname del contenedor y ni el MCP interno ni el mapeo responden)
      - HOSTNAME=0.0.0.0
    depends_on:
      neo4j:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - appnet

networks:
  appnet:
    name: ${DOCKER_NETWORK:-eggseller-net}
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  mongo_data:
